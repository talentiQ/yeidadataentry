<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YEIDA Image to Excel/XML Agent</title>
  <style>
    :root { --blue:#173b64; --light:#f4f7fb; --border:#d7e0ea; --text:#1f2937; }
    body { margin:0; font-family: Arial, sans-serif; color:var(--text); background:var(--light); }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 28px; }
    .card { background:#fff; border:1px solid var(--border); border-radius:16px; padding:24px; box-shadow:0 8px 24px rgba(15,23,42,.06); margin-bottom:20px; }
    h1, h2 { margin-top:0; color:var(--blue); }
    label { font-weight:700; display:block; margin:14px 0 6px; }
    input, textarea, select { width:100%; box-sizing:border-box; padding:12px; border:1px solid var(--border); border-radius:10px; font-size:15px; }
    input[type=file] { padding:10px; background:#fafafa; }
    button, .btn { display:inline-block; border:0; background:var(--blue); color:white; padding:12px 16px; border-radius:10px; font-weight:700; text-decoration:none; cursor:pointer; margin-top:16px; }
    .btn.secondary { background:#44546a; }
    .btn.light { background:#e5eef7; color:var(--blue); }
    .grid { display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap:16px; }
    .grid3 { display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:16px; }
    .flash { border-radius:10px; padding:12px; margin-bottom:16px; }
    .flash.error { background:#fee2e2; border:1px solid #fecaca; color:#991b1b; }
    .flash.success { background:#dcfce7; border:1px solid #bbf7d0; color:#166534; }
    table { width:100%; border-collapse:collapse; font-size:14px; background:white; }
    th, td { border:1px solid var(--border); padding:8px; text-align:left; vertical-align:top; }
    th { background:var(--blue); color:white; position:sticky; top:0; }
    .small { color:#64748b; font-size:13px; }
    .status { display:flex; gap:10px; flex-wrap:wrap; margin:12px 0; }
    .pill { padding:8px 12px; background:#eef4fb; color:var(--blue); border-radius:999px; font-weight:700; }
    @media (max-width: 760px) { .grid, .grid3 { grid-template-columns: 1fr; } .wrap { padding:14px; } }
  </style>
</head>
<body>
  <div class="wrap">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
